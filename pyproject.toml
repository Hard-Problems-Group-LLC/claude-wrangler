[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-wrangler"
dynamic = ["version"]
description = "Manage isolated project-local Claude Code CLI installs."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "M. Heck"}
]
keywords = ["claude", "anthropic", "cli", "tooling", "operations"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Utilities",
]
dependencies = []

[project.urls]
Repository = "https://github.com/Hard-Problems-Group-LLC/claude-wrangler"
Issues = "https://github.com/Hard-Problems-Group-LLC/claude-wrangler/issues"

[project.optional-dependencies]
dev = [
  "black==26.3.1",
  "ruff==0.15.7",
  "pytest==9.0.2",
  "pytest-timeout==2.4.0",
]

[project.scripts]
claude-wrangler = "claude_wrangler.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
license-files = ["LICENSE"]

[tool.setuptools.dynamic]
version = {attr = "claude_wrangler.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

# The bootstrap path, the launcher core, and the verifier must stay
# Python 3.9 compatible, so both tools target the declared floor.
[tool.black]
target-version = ["py39"]

[tool.ruff]
target-version = "py39"
